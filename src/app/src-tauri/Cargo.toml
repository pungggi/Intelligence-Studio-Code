[package]
name = "corecode-app"
version = "0.1.0"
edition = "2021"
description = "CoreCode - Hybrid code editor (Tauri shell + native text engine)"

[lib]
name = "corecode_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Text buffer
ropey = "1.6"

# Syntax highlighting
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-json = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-md = "0.5"

# IPC with Extension Host
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1"

# Async
tokio = { version = "1", features = ["net", "io-util", "sync", "rt-multi-thread", "macros", "time", "process"] }

# Marketplace & extension management
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zip = "2"
dirs = "5"

# Cryptographic random for IPC auth token
getrandom = "0.2"
hex = "0.4"

# Proper URI encoding for file:// paths
url = "2"

# Terminal PTY support (ConPTY on Windows, Unix PTY on macOS/Linux)
portable-pty = "0.8"

# WASM extension host
wasmtime      = { version = "25", features = ["component-model"] }
wasmtime-wasi = "25"

# corecode.toml manifest parsing
toml = "0.8"

[dev-dependencies]
tempfile = "3"
