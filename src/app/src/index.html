<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoreCode</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="titlebar">
      <span id="file-name">CoreCode</span>
      <span id="language-badge"></span>
      <span id="status"></span>
    </div>
    <div id="editor-container">
      <div id="gutter"></div>
      <div id="editor" tabindex="0"></div>
    </div>
    <div id="statusbar">
      <span id="cursor-pos">Ln 1, Col 1</span>
      <span id="file-info"></span>
      <span id="diagnostics-count"></span>
      <span id="ext-host-status">Extension Host: Starting...</span>
    </div>
  </div>

  <!-- Command Palette Overlay -->
  <div id="command-palette" class="palette-hidden">
    <div id="palette-backdrop"></div>
    <div id="palette-panel">
      <input id="palette-input" type="text" placeholder="Type a command..." autocomplete="off" />
      <div id="palette-list"></div>
    </div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
