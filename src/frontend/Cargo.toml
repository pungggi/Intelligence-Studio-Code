[package]
name = "corecode-frontend"
version = "0.1.0"
edition = "2021"
description = "CoreCode native frontend - GPU-accelerated code editor"

[[bin]]
name = "corecode"
path = "src/main.rs"

[[bin]]
name = "spike-renderer"
path = "src/bin/spike_renderer.rs"

[dependencies]
# GPU rendering
wgpu = "22"
winit = "0.30"

# Text buffer
ropey = "1.6"

# Font rasterization
fontdue = "0.9"

# Byte conversion utilities
bytemuck = { version = "1", features = ["derive"] }

# Async runtime
pollster = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
env_logger = "0.11"
log = "0.4"

# Error handling
anyhow = "1"
thiserror = "1"

# Time measurement
instant = "0.1"
