[package]
name = "corecode-frontend"
version = "0.1.0"
edition = "2021"
description = "CoreCode native frontend - GPU-accelerated code editor"

[dependencies]
# GPU rendering
wgpu = "0.19"
winit = "0.29"

# Text buffer
ropey = "1.6"

# Syntax highlighting
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"

# IPC
flatbuffers = "24.3"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
anyhow = "1"
thiserror = "1"
