[extension]
id      = "corecode.hello-wasm"
name    = "Hello WASM"
version = "0.1.0"

[entry]
# Path relative to this directory, produced by:
#   cargo build --target wasm32-wasip2 --release
#   cp target/wasm32-wasip2/release/hello_wasm.wasm hello-wasm.wasm
wasm = "hello-wasm.wasm"

[capabilities]
workspace_read = false
network_fetch  = false
webview_panels = false
