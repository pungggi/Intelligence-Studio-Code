[package]
name    = "cargo-corecode"
version = "0.1.0"
edition = "2021"
description = "Build toolchain for CoreCode WASM extensions — produces .ccext, Zed .zip, and VS Code .vsix from one Rust source"

[[bin]]
name = "cargo-corecode"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive"] }
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
zip        = "2"
walkdir    = "2"
wasmparser = "0.210"
